    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the Pomodoro Technique?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Pomodoro Technique is a time management method created by Francesco Cirillo in the late 1980s. You work in focused 25-minute intervals called pomodoros, separated by 5-minute breaks. After four pomodoros you take a longer 15–30 minute break. It reduces procrastination and protects deep focus."
          }
        },
        {
          "@type": "Question",
          "name": "How long should a Pomodoro session be?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The classic Pomodoro is 25 minutes of focused work followed by a 5-minute break. For deep work or coding, many users prefer 50/10. For ADHD or low-energy days, 15/3 or 20/5 works better. Zen Pomodoro lets you customize all intervals."
          }
        },
        {
          "@type": "Question",
          "name": "Is Zen Pomodoro free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Zen Pomodoro is 100% free, has no ads, requires no signup or email, and works offline. All your tasks, notes and history are stored locally in your browser."
          }
        },
        {
          "@type": "Question",
          "name": "Does Zen Pomodoro work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The timer, tasks, notes and session history work fully offline. Only the optional focus music player (powered by YouTube) requires an internet connection."
          }
        },
        {
          "@type": "Question",
          "name": "Is the Pomodoro Technique good for ADHD?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Many people with ADHD find Pomodoro helpful because it breaks work into short, predictable intervals with built-in breaks, which lowers the activation energy to start. Try shorter cycles (15–20 minutes) and use the task list to capture distractions instead of acting on them."
          }
        },
        {
          "@type": "Question",
          "name": "How is Pomodoro different from time blocking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Time blocking schedules tasks into specific calendar slots. Pomodoro structures the work itself into fixed focus/break intervals. They combine well: block your day, then run pomodoros inside each block."
          }
        },
        {
          "@type": "Question",
          "name": "What should I do during a Pomodoro break?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stand up, stretch, hydrate, look at something far away, or take a short walk. Avoid social media and email — they refill mental load and make the next pomodoro harder to start."
          }
        }
      ]
    }
    </script>
